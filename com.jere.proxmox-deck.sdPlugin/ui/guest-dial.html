<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Guest carousel</title>
		<link rel="stylesheet" href="pi.css" />
	</head>
	<body>
		<h2>This dial</h2>
		<div class="field"><label for="filter">Include</label>
			<select id="filter" data-setting="filter" data-default="all">
				<option value="all">All containers and VMs</option>
				<option value="running">Running only</option>
			</select></div>
		<p class="note">Turn to step through guests. Press: open in the web UI. Hold, or tap the strip: refresh now (the strip shows ✓ Refreshed).</p>
		<hr />
		<div id="connection"></div>
		<script src="pi.js"></script>
	</body>
</html>
